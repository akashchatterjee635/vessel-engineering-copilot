global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'copilot-app'
    static_configs:
      - targets: ['copilot-app:8000']
  
  - job_name: 'mcp-telemetry'
    static_configs:
      - targets: ['mcp-telemetry:8001']

  - job_name: 'mcp-compliance'
    static_configs:
      - targets: ['mcp-compliance:8002']

  - job_name: 'mcp-history'
    static_configs:
      - targets: ['mcp-history:8003']

  - job_name: 'mcp-weather'
    static_configs:
      - targets: ['mcp-weather:8004']

  - job_name: 'mcp-port-services'
    static_configs:
      - targets: ['mcp-port-services:8005']
