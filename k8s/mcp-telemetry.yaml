apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-telemetry
  namespace: vessel-copilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-telemetry
  template:
    metadata:
      labels:
        app: mcp-telemetry
    spec:
      containers:
        - name: mcp-telemetry
          image: vesselcopilot.azurecr.io/mcp-telemetry:latest
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-telemetry
  namespace: vessel-copilot
spec:
  selector:
    app: mcp-telemetry
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
