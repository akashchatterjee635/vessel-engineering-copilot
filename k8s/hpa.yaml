apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: copilot-app-hpa
  namespace: vessel-copilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: copilot-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
