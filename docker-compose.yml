services:
  copilot-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - mcp-telemetry
      - mcp-compliance
      - mcp-history
      - mcp-weather
      - mcp-port-services
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-test-dummy}
      - VESSEL_COPILOT_DB=${VESSEL_COPILOT_DB:-vessel_copilot.db}
      - VESSEL_COPILOT_MODEL=${VESSEL_COPILOT_MODEL:-gpt-5.4-nano}
      - MCP_SERVERS_ENABLED=true
      - MCP_TELEMETRY_URL=http://mcp-telemetry:8001/mcp
      - MCP_COMPLIANCE_URL=http://mcp-compliance:8002/mcp
      - MCP_HISTORY_URL=http://mcp-history:8003/mcp
      - MCP_WEATHER_URL=http://mcp-weather:8004/mcp
      - MCP_PORT_SERVICES_URL=http://mcp-port-services:8005/mcp
      - MODEL_CONFIG_PATH=mlops/model_config.yaml
    networks:
      - mcp-net

  mcp-telemetry:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        SERVER_MODULE: telemetry_server
        SERVER_PORT: 8001
    ports:
      - "8001:8001"
    networks:
      - mcp-net

  mcp-compliance:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        SERVER_MODULE: compliance_server
        SERVER_PORT: 8002
    ports:
      - "8002:8002"
    networks:
      - mcp-net

  mcp-history:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        SERVER_MODULE: history_server
        SERVER_PORT: 8003
    ports:
      - "8003:8003"
    networks:
      - mcp-net
    volumes:
      - db-data:/app/data

  mcp-weather:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        SERVER_MODULE: weather_server
        SERVER_PORT: 8004
    ports:
      - "8004:8004"
    networks:
      - mcp-net

  mcp-port-services:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        SERVER_MODULE: port_services_server
        SERVER_PORT: 8005
    ports:
      - "8005:8005"
    networks:
      - mcp-net

networks:
  mcp-net:
    driver: bridge

volumes:
  db-data:
