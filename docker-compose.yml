services:
  copilot-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - mcp-telemetry
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-test-dummy}
      - VESSEL_COPILOT_DB=${VESSEL_COPILOT_DB:-vessel_copilot.db}
      - VESSEL_COPILOT_MODEL=${VESSEL_COPILOT_MODEL:-gpt-5.4-nano}
      - MCP_SERVERS_ENABLED=true
      - MCP_TELEMETRY_URL=http://mcp-telemetry:8001/mcp
      - MODEL_CONFIG_PATH=mlops/model_config.yaml
    networks:
      - mcp-net

  mcp-telemetry:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        SERVER_MODULE: telemetry_server
        SERVER_PORT: 8001
    ports:
      - "8001:8001"
    networks:
      - mcp-net


networks:
  mcp-net:
    driver: bridge

volumes:
  db-data:
