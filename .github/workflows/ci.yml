name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check (linting)
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Seed database and run test harness
        env:
          OPENAI_API_KEY: sk-test-dummy
          VESSEL_COPILOT_DB: test_vessel_copilot.db
          VESSEL_COPILOT_CHECKPOINTS_DB: test_vessel_checkpoints.db
        run: |
          python tests/seed.py
          python tests/test_harness.py

      - name: Run audit report
        env:
          OPENAI_API_KEY: sk-test-dummy
          VESSEL_COPILOT_DB: test_vessel_copilot.db
        run: python tests/audit_report.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build copilot-app image
        run: docker build -f Dockerfile -t copilot-app:ci .

      - name: Build MCP telemetry image
        run: docker build -f Dockerfile.mcp --build-arg SERVER_MODULE=telemetry_server --build-arg SERVER_PORT=8001 -t mcp-telemetry:ci .

      - name: Build MCP compliance image
        run: docker build -f Dockerfile.mcp --build-arg SERVER_MODULE=compliance_server --build-arg SERVER_PORT=8002 -t mcp-compliance:ci .

      - name: Build MCP history image
        run: docker build -f Dockerfile.mcp --build-arg SERVER_MODULE=history_server --build-arg SERVER_PORT=8003 -t mcp-history:ci .

      - name: Build MCP weather image
        run: docker build -f Dockerfile.mcp --build-arg SERVER_MODULE=weather_server --build-arg SERVER_PORT=8004 -t mcp-weather:ci .

      - name: Build MCP port services image
        run: docker build -f Dockerfile.mcp --build-arg SERVER_MODULE=port_services_server --build-arg SERVER_PORT=8005 -t mcp-port-services:ci .
