name: Deploy to AKS

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-aks:
    runs-on: ubuntu-latest
    if: $\{{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }\}
    steps:
      - uses: actions/checkout@v4

      # In a real environment, we would authenticate with Azure and ACR
