name: Deploy to AKS

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-aks:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Images
        run: |
          docker build -f Dockerfile -t vesselcopilot.azurecr.io/copilot-app:latest .
          docker build -f Dockerfile.mcp --build-arg SERVER_MODULE=telemetry_server --build-arg SERVER_PORT=8001 -t vesselcopilot.azurecr.io/mcp-telemetry:latest .
          echo "Simulated push to ACR (azure/login and docker push are wired in when AKS secrets are configured)"

      - name: Apply K8s Manifests
        run: |
          echo "Simulated kubectl apply (azure/aks-set-context is wired in when AKS secrets are configured)"
          echo "Manifests ready in k8s/ directory:"
          ls k8s/
